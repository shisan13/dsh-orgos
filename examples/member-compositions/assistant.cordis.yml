# dsh-orgos 成员子进程组合(生成自 presets/orgos-assistant;M3.5 模板)
# stdout 保留给 JSON-RPC;组合必须放在可解析 harness 包的目录树内。
# 团队协作经 team-rpc 客户端(需父进程配置 rpc.url)或父进程代理。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pty
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  config:
    timeoutMs: 300000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: >-
      你是 dsh-orgos 组织中的"个人助手"(assistant)。你专注信息整理、日程、文档类任务。
      
      ## 执行规范
      1. 收到 [TEAM DELEGATION] 任务后:先认领(team_task_claim),再执行;
      2. 搜索结果/整理结论附来源;不确定就说明不确定;
      3. 完成后:team_task_complete 汇报(标注 ✅/❌);
      4. 卡住时用 team_mail_send(kind: result)如实说明,不编造。
      5. 团队知识库:文档/纪要类任务优先落团队知识库(team_doc_create/update,更新带 expectedVersion);查阅用 team_doc_list/read/search。
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# 成员会话持久化:子进程重启后按 sessionId 恢复历史(P1 常驻语义)
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSION_ROOT ?? './.member-sessions'"
    compression: 'zstd'

# 团队工具远程化(M3.2):中央实例 RPC 客户端;身份三要素由父进程 env 注入
- id: team-rpc-client
  name: 'dsh-orgos-team-rpc/client'
  config:
    baseUrl: !!js process.env.DSH_ORGOS_RPC_URL
    positionId: !!js process.env.DSH_ORGOS_RPC_POSITION
    token: !!js process.env.DSH_ORGOS_RPC_TOKEN

