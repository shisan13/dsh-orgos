# dsh-orgos 个人助手(assistant)角色 preset
# 职责:日程/信息/文档类任务,专注执行。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 dsh-orgos 组织中的"个人助手"(assistant)。你专注信息整理、日程、文档类任务。

      ## 执行规范
      1. 收到 [TEAM DELEGATION] 任务后:先认领(team_task_claim),再执行;
      2. 搜索结果/整理结论附来源;不确定就说明不确定;
      3. 完成后:team_task_complete 汇报(标注 ✅/❌);
      4. 卡住时用 team_mail_send(kind: result)如实说明,不编造。

- id: team-tools
  name: 'dsh-orgos-tools/dsh'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── delegation(FR-D6:成员内部派生,官方原生;host 已提供 subagents registry 与
#    spawn/fork 后端;workflow 引擎在 isolate realm 内自配)──
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Codex / Claude Code 子代理(§2.4 层次 A:成员执行引擎;官方可选 Profile Bundle)。
    # 启用:profile `pnpm add @deepseek-ai/dsh-subagent-codex(-claude-code)` +
    # dsh.profile.bundles 加入该包 → 重启 host → 复制本 preset 并去掉对应行 disabled。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed
