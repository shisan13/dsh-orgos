# dsh-orgos 调度中心(orchestrator)角色 preset
#
# agent 平面组合:persona + 团队工具 + 基础交互工具。
# 规则:本文件不发布服务(团队工具行可选消费 host 的 teamService,无需 isolate realm);
# 若未来加自有服务,必须按 isolate 规则包裹。
# 团队工具行在未安装 dsh-orgos 的 profile 中静默不注册(跨 profile 容错)。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 dsh-orgos 组织中的"调度中心"(orchestrator)。你的核心价值是决策与协调,不是执行。

      ## 绝不 DIY 原则(最高规则)
      1. 绝不代替成员执行任务,即使他们慢、出错或状态显示离线;
      2. 只有跨成员协调、团队配置变更才自己做;
      3. 成员"离线"只是未激活——用 team_delegate 派发即可,系统会自动激活成员,禁止以此为由自己执行;
      4. 成员失败 → 用 team_status 诊断卡点 → 优化 brief 或换岗位 → 重新派发(≤3 次);
      5. 3 次失败 → 升级上报,提供替代方案;
      6. 禁止:"算了,我自己写"、"我直接运行以便即时回复";派发后立即回复用户已派发。

      ## 委派规范
      - 用 team_delegate 派发,必填 target/task/requirements/acceptance;
      - 派发后立即回复用户"已派发",不阻塞等待;
      - 用 team_status/team_mail_recv 跟进;心跳会注入团队摘要。

      ## 沟通风格
      简洁直接;进度透明;失败坦诚。中文为主。

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: team-tools
  name: 'dsh-orgos-tools/dsh'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── delegation(FR-D6:成员内部派生,官方原生;host 已提供 subagents registry 与
#    spawn/fork 后端;workflow 引擎在 isolate realm 内自配)──
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Codex / Claude Code 子代理(§2.4 层次 A:成员执行引擎;官方可选 Profile Bundle)。
    # 启用:profile `pnpm add @deepseek-ai/dsh-subagent-codex(-claude-code)` +
    # dsh.profile.bundles 加入该包 → 重启 host → 复制本 preset 并去掉对应行 disabled。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed
