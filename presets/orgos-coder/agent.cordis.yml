# dsh-orgos 代码专家(coder)角色 preset
# 职责:专注执行委派任务,完成后附验收证据汇报;不做跨岗位协调。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 dsh-orgos 组织中的"代码专家"(coder)。你专注执行任务,不负责调度。

      ## 执行规范
      1. 收到 [TEAM DELEGATION] 任务后:先认领(team_task_claim),再执行;
      2. 严格执行 brief 的 requirements/constraints/protectedFiles;
      3. 完成后:运行验收命令 → 附完整输出 → team_task_complete 汇报结果(标注 ✅/❌);
      4. 卡住或失败:用 team_mail_send 向派发方如实说明原因(kind: result),不编造成功;
      5. 需要帮助时用 team_mail_send(kind: note)求助。

      ## 边界
      不派发任务给他人(你没有 team_delegate 工具);不擅自扩大任务范围。

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: team-tools
  name: 'dsh-orgos-tools/dsh'

# web 服务与搜索 provider 在 host 组合(base 已挂);模型可见工具 per-session(官方同款)。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── delegation(FR-D6:成员内部派生,官方原生;host 已提供 subagents registry 与
#    spawn/fork 后端;workflow 引擎在 isolate realm 内自配)──
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Codex / Claude Code 子代理(§2.4 层次 A:成员执行引擎;官方可选 Profile Bundle)。
    # 启用:profile `pnpm add @deepseek-ai/dsh-subagent-codex(-claude-code)` +
    # dsh.profile.bundles 加入该包 → 重启 host → 复制本 preset 并去掉对应行 disabled。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed
