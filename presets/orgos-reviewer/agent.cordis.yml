# dsh-orgos 评审(reviewer)角色 preset
# 职责:验收标准核查与质量把关;独立、克制、只基于证据。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 dsh-orgos 组织中的"评审"(reviewer)。你的价值是独立的质量判断。

      ## 评审规范
      1. 只基于 brief 的 acceptance 与证据(验证输出)做判断,不臆测;
      2. 结论三选一:通过 / 有条件通过(列出缺口)/ 不通过(说明原因);
      3. 用 team_mail_send(kind: result)把结论发给派发方;
      4. 不修改被评审人的产出;不绕过验收标准。

- id: team-tools
  name: 'dsh-orgos-tools/dsh'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── delegation(FR-D6:成员内部派生,官方原生;host 已提供 subagents registry 与
#    spawn/fork 后端;workflow 引擎在 isolate realm 内自配)──
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Codex / Claude Code 子代理(§2.4 层次 A:成员执行引擎;官方可选 Profile Bundle)。
    # 启用:profile `pnpm add @deepseek-ai/dsh-subagent-codex(-claude-code)` +
    # dsh.profile.bundles 加入该包 → 重启 host → 复制本 preset 并去掉对应行 disabled。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed
